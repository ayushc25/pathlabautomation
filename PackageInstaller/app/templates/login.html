<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - LIS ASTM Integration</title>
  <meta name="description" content="Secure portal to configure analyzer mappings, review raw ASTM captures, and push commands.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --accent-secondary: #0ea5e9;
      --accent-hover: #4f46e5;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.1);
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                  var(--bg-dark);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(92vw, 440px);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(99, 102, 241, 0.1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 28px;
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 15px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(15, 23, 42, 0.8);
    }

    button {
      margin-top: 28px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-secondary));
    }

    button:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 16px;
    }

    .error {
      margin: 0 0 20px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error-text);
      font-size: 14px;
      line-height: 1.4;
    }

    code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent-secondary);
      font-family: Consolas, monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mapping Login</h1>
    <p>Enter your Piysan LIS mobile and password credentials to log in, or use the local fallback admin credentials.</p>
    {% if error %}
    <div class="error" id="loginError">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" placeholder="Enter username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      <button type="submit" id="submitBtn">Sign In</button>
    </form>
    <div class="hint">Sign in with your Piysan LIS mobile number and password.</div>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Signing In...';
      
      let errorDiv = document.getElementById('loginError');
      if (!errorDiv) {
        errorDiv = document.createElement('div');
        errorDiv.className = 'error';
        errorDiv.id = 'loginError';
        const card = document.querySelector('.card');
        const form = document.getElementById('loginForm');
        card.insertBefore(errorDiv, form);
      }
      errorDiv.style.display = 'none';
      
      const formData = new FormData(this);
      
      try {
        const response = await fetch('/login', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        
        if (response.ok && data.status === 'success') {
          window.location.href = data.redirect;
        } else {
          errorDiv.textContent = data.message || 'Login failed';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = `Error connecting to server: ${err.message}`;
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  </script>
</body>
</html>
