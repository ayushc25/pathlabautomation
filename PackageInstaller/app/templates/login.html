<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    :root { color-scheme: light; --bg1:#f7f3ea; --bg2:#e7eef7; --card:#ffffff; --text:#17212b; --muted:#61707f; --accent:#1d4ed8; --accent2:#0f766e; --border:#d7dee8; }
    body { margin:0; min-height:100vh; font-family: Arial, sans-serif; color:var(--text); background: linear-gradient(135deg, var(--bg1), var(--bg2)); display:grid; place-items:center; }
    .card { width:min(92vw, 420px); background:var(--card); border:1px solid var(--border); border-radius:20px; padding:32px; box-shadow:0 18px 50px rgba(15,23,42,.12); }
    h1 { margin:0 0 8px; font-size:32px; }
    p { margin:0 0 20px; color:var(--muted); line-height:1.5; }
    label { display:block; margin:14px 0 6px; font-size:14px; font-weight:700; }
    input { width:100%; box-sizing:border-box; padding:12px 14px; border-radius:12px; border:1px solid var(--border); font-size:15px; }
    button { margin-top:18px; width:100%; border:0; border-radius:12px; padding:12px 14px; background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    .hint { margin-top:14px; font-size:13px; color:var(--muted); }
    .error { margin:0 0 14px; padding:10px 12px; border-radius:10px; background:#fef2f2; color:#b91c1c; }
    code { background:#eef2ff; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mapping Login</h1>
    <p>Use dummy credentials to open the mapping setup screen for Sk lab.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
    <div class="hint">Dummy creds: <code>admin</code> / <code>admin123</code></div>
  </div>
</body>
</html>
